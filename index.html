<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Diwali, My Love ❤️🪔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Yatra+One&display=swap" rel="stylesheet">
<style>
:root{--night:#14052e;--plum:#4a1257;--gold:#ffcf4a;--saffron:#ff8a1f;--pink:#ff5c93;--ink:#fff6e2;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html{-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;min-height:100dvh;background:radial-gradient(ellipse at 50% 110%,#7a1f5c 0,var(--plum) 35%,var(--night) 75%) fixed;color:var(--ink);font-family:'Baloo 2','Trebuchet MS',sans-serif;overflow-x:hidden;text-align:center}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#stars i{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s infinite;opacity:.2}
@keyframes tw{50%{opacity:.95;transform:scale(1.6)}}
main{position:relative;z-index:2;max-width:980px;margin:0 auto;padding:22px 14px 30px}
.hi{font-family:'Yatra One','Noto Sans Devanagari',serif;font-weight:400;font-size:clamp(46px,11vw,100px);margin:6px 0 0;line-height:1.1;color:var(--gold);text-shadow:0 0 18px #ff9d1f,0 0 48px #ff5c1f;animation:glow 2.4s ease-in-out infinite alternate}
@keyframes glow{to{text-shadow:0 0 28px #ffd34d,0 0 70px #ff7a1f;transform:scale(1.025)}}
.en{font-size:clamp(24px,5vw,38px);font-weight:800;margin:0;letter-spacing:.04em}
.en b{display:inline-block;animation:hop 1.6s ease-in-out infinite}
.en b:nth-child(2n){animation-delay:.2s}.en b:nth-child(3n){animation-delay:.4s}
@keyframes hop{50%{transform:translateY(-8px) rotate(-4deg)}}
.gods{display:flex;align-items:flex-end;justify-content:center;gap:clamp(4px,3vw,36px);margin-top:10px}
.god{width:clamp(130px,31vw,290px);cursor:pointer}
.frame{position:relative;width:100%;aspect-ratio:9/15;border-radius:50% 50% 16px 16px/30% 30% 16px 16px;overflow:hidden;border:4px solid var(--gold);box-shadow:0 0 0 3px #b3550f,0 0 30px 6px rgba(255,190,60,.55),0 0 80px rgba(255,120,40,.35);animation:bob 3.2s ease-in-out infinite,pulse 2.4s ease-in-out infinite alternate}.frame img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}.frame:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,240,180,.45) 50%,transparent 65%);background-size:250% 100%;animation:shine 4s ease-in-out infinite}@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}@keyframes pulse{to{box-shadow:0 0 0 3px #b3550f,0 0 46px 12px rgba(255,210,80,.75),0 0 110px rgba(255,120,40,.5)}}
#g2 .frame{animation-delay:-1.6s,-1s}
.god:active .frame{animation:jump .5s}
@keyframes bob{50%{transform:translateY(-12px) rotate(1.5deg)}}
@keyframes jump{40%{transform:translateY(-34px) scale(1.06)}}
.god span{display:block;font-weight:800;font-size:clamp(14px,3vw,20px);color:var(--gold);margin-top:2px}
.mid{width:clamp(60px,14vw,130px)}
.bl{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.ear{transform-box:fill-box;animation:flap 2.6s ease-in-out infinite}
.el{transform-origin:100% 50%}.er{transform-origin:0 50%;animation-delay:-1.3s}
@keyframes flap{50%{transform:rotate(-9deg)}}
.er{animation-name:flapr}@keyframes flapr{50%{transform:rotate(9deg)}}
.trunk{transform-box:fill-box;transform-origin:50% 0;animation:sway 2.8s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(7deg)}}
.coin{animation:fall 2.2s ease-in infinite;opacity:0}
.coin:nth-of-type(2){animation-delay:.7s}.coin:nth-of-type(3){animation-delay:1.4s}
@keyframes fall{0%{transform:translateY(-8px);opacity:0}15%{opacity:1}100%{transform:translateY(62px);opacity:0}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:fl .35s ease-in-out infinite alternate}
@keyframes fl{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.12) rotate(3deg)}}
.unlit .flame,.unlit .glowc{opacity:0;transform:scale(0)}
.flame,.glowc{transition:opacity .5s,transform .5s}
#wish{min-height:3.2em;font-size:clamp(17px,3.6vw,24px);font-weight:600;max-width:640px;margin:14px auto 6px;transition:opacity .5s}
.crackers{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0 8px}
.crackers button{font:800 clamp(15px,3.4vw,19px) 'Baloo 2',sans-serif;color:#3b1200;background:linear-gradient(#ffe37a,#ffa72b);border:0;border-radius:999px;padding:9px 18px;cursor:pointer;box-shadow:0 5px 0 #b3550f,0 10px 22px rgba(255,150,30,.35);animation:wob 2.4s ease-in-out infinite}
.crackers button:nth-child(2n){animation-delay:-.8s;background:linear-gradient(#ffb3d1,#ff5c93);box-shadow:0 5px 0 #a3194f,0 10px 22px rgba(255,92,147,.35)}
.crackers button:nth-child(3n){animation-delay:-1.5s}
.crackers button:active{transform:translateY(4px);box-shadow:0 1px 0 #b3550f}
.crackers button:focus-visible{outline:3px solid #fff;outline-offset:3px}
@keyframes wob{50%{transform:rotate(-2.5deg) scale(1.04)}}
.diyas{display:flex;justify-content:center;gap:clamp(4px,2vw,18px);margin-top:18px}
.diyas svg{width:clamp(30px,8vw,64px);height:auto;cursor:pointer;overflow:visible}
.hint{font-size:14px;opacity:.75;margin:6px 0 0}
.lan{position:fixed;bottom:-60px;font-size:30px;z-index:1;animation:rise linear infinite;opacity:.9}
@keyframes rise{to{transform:translateY(-115vh) translateX(30px) rotate(8deg)}}
.shake{animation:sh .45s}
@keyframes sh{20%{transform:translate(-6px,4px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,-3px)}80%{transform:translate(4px,3px)}}
*{-webkit-tap-highlight-color:transparent}.love{font-size:clamp(18px,4vw,26px);font-weight:800;color:var(--pink);text-shadow:0 0 16px rgba(255,92,147,.7);margin:18px 0 0;animation:beat 1.2s ease-in-out infinite}@keyframes beat{50%{transform:scale(1.06)}}button,.god,.dy{touch-action:manipulation}
@media (max-width:640px){main{padding:12px 10px 26px}.mid{display:none}.gods{gap:10px;margin-top:6px}.god{width:44vw;max-width:230px}.frame{border-width:3px}.god span{font-size:14px}.hi{margin-top:0}#wish{font-size:17px;min-height:4.2em;padding:0 6px}.crackers{gap:8px}.crackers button{padding:9px 15px;min-height:44px}.hint{font-size:13px;padding:0 10px}.diyas svg{width:9vw}.lan{font-size:22px}}
@media (max-width:360px){.crackers button{font-size:14px;padding:8px 12px}.god span{font-size:13px}}
@media (max-height:480px) and (orientation:landscape){.god{width:24vw}.hi{font-size:40px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head><body>

<main id="m">

const DIYA=`<svg viewBox="0 0 80 70" class="dy unlit"><circle class="glowc" cx="40" cy="22" r="26" fill="#ffb02e" opacity=".35"/><path class="flame" d="M40 4Q54 22 40 34Q26 22 40 4Z" fill="#ffcf4a"/><path class="flame" d="M40 16Q47 26 40 33Q33 26 40 16Z" fill="#fff3b0"/><path d="M6 36Q40 30 74 36Q70 64 40 66Q10 64 6 36Z" fill="#e0701c" stroke="#a8480a" stroke-width="2"/><path d="M14 44Q40 52 66 44" stroke="#ffd34d" stroke-width="3" fill="none"/><circle cx="40" cy="52" r="3" fill="#ffd34d"/></svg>`;
$('#bigdiya').innerHTML=DIYA.replace('unlit','');
for(let i=0;i<9;i++){const d=document.createElement('div');d.innerHTML=DIYA;const s=d.firstChild;s.onclick=()=>{s.classList.toggle('unlit');if(!s.classList.contains('unlit')){const r=s.getBoundingClientRect();burst(r.x+r.width/2,r.y,24,pal[0],.6)}};$('#diyas').append(s);setTimeout(()=>s.classList.remove('unlit'),600+i*350)}
$('#en').innerHTML=Array.from('Happy Diwali, '+(NAME||'My Love')+'!').map(c=>c==' '?' ':'<b>'+c+'</b>').join('');
for(let i=0;i<70;i++){const s=document.createElement('i');s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*70}%;animation-delay:${Math.random()*3}s`;$('#stars').append(s)}
for(let i=0;i<14;i++){const l=document.createElement('div');l.className='lan';l.textContent=['❤️','🪔','💖','✨','💕','🏮'][i%6];l.style.cssText=`left:${4+i*7}%;animation-duration:${16+Math.random()*12}s;animation-delay:${-Math.random()*20}s`;document.body.append(l)}
const W8=['May the light of diyas fill your home with joy and prosperity ✨','Wishing you sweets, smiles and sparkling moments! 🍬','May Lakshmi Ji bless you with wealth, health and happiness 🪷','May Ganesh Ji clear every obstacle from your path 🐘','आपको और आपके परिवार को दीपावली की हार्दिक शुभकामनाएँ! 🪔','May every day ahead be as bright as tonight’s sky 🎆'];
W8.splice(0,W8.length,'You are the light that makes every day brighter than a thousand diyas ❤️','May our love shine brighter with every Diwali we celebrate together 🪔','Lakshmi Ji, bless my love with endless happiness 🪷','Ganesh Ji, keep every obstacle far away from us 🐘','तुम्हारी मुस्कान से रोशन है मेरी हर दिवाली ✨','Forever and always, you are my favourite sparkle 💖');let wi=0;const wl=$('#wish');wl.textContent=W8[0];setInterval(()=>{wl.style.opacity=0;setTimeout(()=>{wi=(wi+1)%W8.length;wl.textContent=W8[wi];wl.style.opacity=1},500)},4000);
/* fireworks */
const cv=$('#fx'),c=cv.getContext('2d');let W,H,D=Math.min(devicePixelRatio||1,2);
function rs(){W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;c.setTransform(D,0,0,D,0,0)}rs();addEventListener('resize',rs);
const pal=[['#ffcf4a','#ff9f1c','#fff3b0'],['#ff4d8d','#ff9ec4','#ffffff'],['#4df0ff','#7c5cff','#d0b3ff'],['#7dff7a','#eaff6b','#ffffff'],['#ff6b3d','#ffd23f','#ff3d71']];
const P=[],R=[],E=[];let snd=false,ac;
function pop(v=.35){if(!snd)return;try{ac=ac||new AudioContext();const n=ac.sampleRate*.3,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);const s=ac.createBufferSource(),g=ac.createGain();g.gain.value=v;s.buffer=b;s.connect(g).connect(ac.destination);s.start()}catch(e){}}
function burst(x,y,n=70,cs=pal[Math.random()*pal.length|0],sp=1){for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*.2,v=(2+Math.random()*3.5)*sp;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:0,m:55+Math.random()*30,c:cs[i%cs.length],s:2+Math.random()*1.6,g:.05})}pop(.3)}
function heart(x,y){const cs=['#ff4d8d','#ff9ec4','#ffffff','#ff2d55'];for(let i=0;i<80;i++){const t=Math.PI*2*i/80,hx=16*Math.pow(Math.sin(t),3),hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));P.push({x,y,vx:hx*.33,vy:hy*.33,l:0,m:70,c:cs[i%4],s:2.4,g:.012})}pop(.3)}
function rocket(x,y=H,ty=H*(.15+Math.random()*.3)){R.push({x,y,ty,vy:-8-Math.random()*2})}
function spark(x,y,vx,vy,col,m=30,g=.12){P.push({x,y,vx,vy,l:0,m,c:col,s:2,g})}
function loop(){c.globalCompositeOperation='destination-out';c.fillStyle='rgba(0,0,0,.2)';c.fillRect(0,0,W,H);c.globalCompositeOperation='lighter';
for(let i=R.length-1;i>=0;i--){const r=R[i];r.y+=r.vy;r.vy*=.992;P.push({x:r.x,y:r.y,vx:(Math.random()-.5)*.6,vy:1,l:0,m:16,c:'#ffd9a0',s:2,g:.02});if(r.y<=r.ty){(Math.random()<.5?heart:burst)(r.x,r.y);R.splice(i,1)}}
for(let i=E.length-1;i>=0;i--){const e=E[i];e.t++;if(e.t>e.d){E.splice(i,1);continue}
if(e.k=='anar')for(let j=0;j<5;j++)spark(e.x,e.y,(Math.random()-.5)*3,-5-Math.random()*5,pal[e.t%5][j%3],40+Math.random()*20,.15);
else{e.a+=.45;for(let j=0;j<3;j++){const a=e.a+j*2.09;spark(e.x+Math.cos(a)*14,e.y+Math.sin(a)*14,Math.cos(a+1.6)*4+(Math.random()-.5),Math.sin(a+1.6)*4-1,pal[(e.t>>3)%5][j],24,.1)}}}
for(let i=P.length-1;i>=0;i--){const p=P[i];p.l++;if(p.l>p.m){P.splice(i,1);continue}p.vy+=p.g;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;c.globalAlpha=1-p.l/p.m;c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,p.s,0,6.3);c.fill()}
c.globalAlpha=1;requestAnimationFrame(loop)}loop();
const mid=el=>{const r=el.getBoundingClientRect();return[r.x+r.width/2,r.y+r.height/2]};
const act={anar(b){const[x,y]=mid(b);E.push({k:'anar',x,y:y-20,t:0,d:150})},chakri(b){const[x,y]=mid(b);E.push({k:'chakri',x,y:y-40,t:0,d:200,a:0})},rocket(b){rocket(mid(b)[0],mid(b)[1])},
bomb(){burst(W/2,H*.4,160,pal[0],1.8);burst(W/2,H*.4,90,pal[1],1.1);document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),450)},
show(){for(let i=0;i<14;i++)setTimeout(()=>rocket(W*(.08+Math.random()*.84)),i*260)}};
document.querySelectorAll('.crackers button').forEach(b=>b.onclick=e=>{e.stopPropagation();snd=true;act[b.dataset.c](b)});
['g1','g2'].forEach((id,k)=>$('#'+id).onclick=e=>{snd=true;e.stopPropagation();const[x,y]=mid($('#'+id));burst(x,y-40,60,pal[k?1:0]);for(let i=0;i<6;i++)setTimeout(()=>burst(x+(Math.random()-.5)*160,y-80-Math.random()*80,30),i*120)});
document.addEventListener('pointerdown',e=>{if(e.target.closest('button,.dy,.god'))return;snd=true;(Math.random()<.5?heart:burst)(e.clientX,e.clientY)});
setInterval(()=>{if(!document.hidden)rocket(W*(.1+Math.random()*.8))},2200);
setTimeout(act.show,800);
</script></body></html>
